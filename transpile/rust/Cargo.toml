[package]
name = "flint-core-wasm"
version = "0.1.0"
edition = "2021"
description = "Flint chart core compiled to a Typst wasm plugin"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Typst's plugin ABI: `#[wasm_func]` exports the (ptr, len) -> i32 shape that
# typst's `plugin()` expects, with results written back via a host callback.
wasm-minimal-protocol = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Compile the depyler output in place of the hand-written core. Off by default:
# as of depyler 4.1.2 the generated module does not build (see ../REPORT.md).
generated = []

[profile.release]
# Typst loads the plugin on every compile, so size matters more than peak speed.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"
