[package]
name = "flint-typst"
version = "0.2.2"
entrypoint = "src/lib.typ"
authors = ["Zral0kh"]
license = "MIT"
description = "Semantic chart compiler for Typst — a port of microsoft/flint-chart's core, with a lilaq backend."
keywords = ["chart", "plot", "visualization", "lilaq", "prima-viz", "data"]
categories = ["visualization"]
compiler = "0.13.0"
exclude = ["test", "tests", "bench", "docs", "flint-source", "Makefile", "requirements.txt"]

[tool.tytanic]
default.ppi = 72
